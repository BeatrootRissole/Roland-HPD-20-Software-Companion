name: build

# Builds with the C# compiler that ships with the Windows runner - the same command a user runs
# locally - then runs every self-test suite and keeps the results as an artifact.

on:
  push:
    branches: [main]
    tags-ignore: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # net48 is what Windows 10/11 ships; the build uses the in-box csc, so no SDK is needed.
        target: [net48]

    steps:
      - uses: actions/checkout@v4

      - name: Show the compiler that will be used
        shell: pwsh
        run: |
          $csc = Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          if (-not (Test-Path $csc)) { throw "csc.exe not found" }
          & $csc /? | Select-Object -First 1

      - name: Build
        shell: pwsh
        run: .\build.ps1

      - name: Run every self-test suite
        shell: pwsh
        run: |
          .\build.ps1 -Test
          if ($LASTEXITCODE -ne 0) { throw "self-tests failed" }

      - name: Show the reports even when a suite fails
        if: failure()
        shell: pwsh
        run: |
          Get-ChildItem test-results -Filter *.txt | ForEach-Object {
            Write-Host "----- $($_.Name) -----"
            Get-Content $_.FullName | Select-String -Pattern '^FAIL|^SKIP' | ForEach-Object { Write-Host $_.Line }
          }

      - name: Summarise the test reports
        if: always()
        shell: pwsh
        run: |
          $out = @()
          $out += '### Self-test results'
          $out += ''
          $out += '| suite | pass | fail | skip |'
          $out += '|---|---|---|---|'
          $fail = 0
          Get-ChildItem test-results -Filter *.txt | Sort-Object Name | ForEach-Object {
            $body = Get-Content $_.FullName
            $p = ($body | Select-String '^PASS').Count
            $f = ($body | Select-String '^FAIL').Count
            $s = ($body | Select-String '^SKIP').Count
            $fail += $f
            $out += "| $($_.BaseName) | $p | $f | $s |"
          }
          $out -join "`n" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          if ($fail -gt 0) { throw "$fail failure(s) across the suites" }

      - name: Keep the built executables and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hpd20-companion-${{ matrix.target }}
          path: |
            dist/HPD20Companion.exe
            dist/cli/hpd20cli.exe
            test-results/*.txt
          if-no-files-found: error
